name: Desktop CI

# DRAFT — SYNCDESKTOP.md F7 ("Paketleme ve CI").
#
# This workflow has never been executed (push is forbidden for lanes in this repo per
# docs/ENGINEERING-RULES.md §1 / SYNCDESKTOP.md §0.2, so nothing can trigger a real run from here).
# Syntax is validated locally with a YAML parser and `bash -n` on every `run:` block — see
# the F3-E phase report for the exact commands and output. Do not treat this file as
# CI-green evidence; it has never actually executed.
#
# Re-aligned in F3-E against the real tree landed by F2/W2-b/F3-A
# (`docs/DESKTOP-ARCHITECTURE.md` EK 2 + E.5.2/E.5.3). Every path referenced below was
# confirmed to exist at re-alignment time:
#   - desktop/Cargo.toml            — cargo workspace, members = ["crates/syncra-sync", "src-tauri"]
#   - desktop/crates/syncra-sync    — sync engine crate (package `syncra-sync`)
#   - desktop/src-tauri             — Tauri 2 shell crate (package `syncra-desktop`), depends on
#                                      syncra-sync as a workspace path dependency
#   - desktop/package.json          — scripts: dev:desktop, build:desktop, tauri, dev
#   - desktop/scripts/tauri.mjs     — the `tauri` script; wraps `@tauri-apps/cli`, injects a
#                                      build-time CSP read from ../frontend/.env
# `desktop/.cargo/config.toml` no longer exists (removed in F3-A) — the workspace's shared
# `desktop/target` is what actually prevents the vendored OpenSSL tree from being compiled
# twice, so the jobs below run `cargo` from the `desktop/` workspace root with `--workspace`
# instead of cd-ing into one member crate's directory.

on:
  pull_request:
    branches: [main, feat/desktop]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches: [feat/desktop]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

  # Disk, not taste. The 2026-09-01 run died on ubuntu-24.04 with
  # `failed to build archive ...: No space left on device` while compiling `tauri-utils` —
  # a GitHub-hosted Linux runner has roughly 14 GB free on `/`, and this workspace does not
  # fit in it unless both of these are set. Measured on a full local debug tree (45.6 GB):
  #   incremental/  23.9 GB   <- CARGO_INCREMENTAL=0 removes it outright
  #   deps/         15.7 GB   <- of which debug info is the largest single share
  #   build/         3.4 GB
  # Incremental artifacts are worthless on a fresh runner (nothing to be incremental FROM,
  # and rust-cache does not restore them), and nothing in CI attaches a debugger, so the
  # debug info is paid for and never read. Backtraces lose line numbers; that is the whole
  # cost, and a CI failure is reproduced locally anyway.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ---------------------------------------------------------------------------
  # syncra-sync crate: cargo test + clippy, 3-OS matrix (SYNCDESKTOP.md §5.7, §0.4)
  # ---------------------------------------------------------------------------
  desktop-rust:
    name: rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Runner pinned, not `ubuntu-latest`: a silent image bump changes the glibc and
        # WebKitGTK the workspace links against, and this job is the only Linux gate before
        # `desktop-release.yml` produces the shipped artifact. 24.04 was chosen over 22.04
        # after the first real CI run (2026-08-31): 22.04's webkit2gtk-4.1 is two generations
        # behind the 2.52.3 the D-4 Linux measurement actually ran against, and the 22.04
        # image is being retired. `desktop-release.yml` deliberately does NOT follow this
        # bump — see the note there; raising the release runner raises the glibc floor for
        # every user, which is a product decision, not a CI one.
        os: [windows-latest, ubuntu-24.04, macos-latest]
    defaults:
      run:
        # F3-E: `desktop/` is the cargo workspace root (members: crates/syncra-sync,
        # src-tauri — `desktop/Cargo.toml`). Running from here with `--workspace` below
        # builds/tests/lints both crates through the one shared `desktop/target`; cd-ing into
        # `crates/syncra-sync` and building it standalone (this job's old shape) leaves
        # `syncra-desktop` — which path-depends on it — to be compiled from scratch again by
        # `desktop-tauri-build`, recompiling the vendored OpenSSL tree a second time.
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --- Precondition 1 (Windows only) --------------------------------------
      # `rusqlite` is built with the `bundled-sqlcipher-vendored-openssl` feature
      # (SYNCDESKTOP.md §5.1), which vendors and compiles OpenSSL from source via the
      # `openssl-src` crate's Perl-based `Configure` script. Locally (F3-A) this failure was
      # reproduced and re-diagnosed precisely: it is NOT a missing Perl install. Git-Bash's
      # own `perl` resolves first on PATH and does not carry `ExtUtils::MakeMaker` /
      # `Locale::Maketext::Simple`, while a full Perl already on the same machine
      # (`C:\xampp\perl\bin\perl.exe`, 5.32) does carry both. `windows-latest` has the same
      # shape of problem — Git's bundled Perl sits on PATH alongside a full Strawberry Perl
      # install. Prepending Strawberry's bin dir to GITHUB_PATH here makes it win the lookup
      # for every later step in this job — the fix is PATH order, not installation.
      - name: Prefer Strawberry Perl over Git's Perl (Windows OpenSSL vendored build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strawberry = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path $strawberry)) {
            throw "Strawberry Perl not found at $strawberry - runner image changed, update this step"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $strawberry
          perl -MExtUtils::MakeMaker -e "print 'ExtUtils::MakeMaker OK'"

      # --- Precondition 2 (Windows only) --------------------------------------
      # The vendored OpenSSL build copies its C source tree into a nested path under
      # `target/<profile>/build/openssl-src-*/out/...`. Combined with the already-deep
      # GitHub Actions workspace path, the copied path can exceed Windows' 260-char MAX_PATH
      # and fail with "There are files missing, probably because of a failed Makefile.PL
      # etc.". `desktop/.cargo/config.toml` used to redirect the target dir for this same
      # reason; it was removed in F3-A because the workspace's own default `desktop/target`
      # already gives one shared target dir for both crates — CARGO_TARGET_DIR is the
      # supported escape hatch if a given runner's path still overflows, not a committed
      # config file.
      - name: Use short CARGO_TARGET_DIR (Windows MAX_PATH workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_TARGET_DIR=C:\t'

      # --- Precondition 4 (Linux only) --------------------------------------
      # `--workspace` below also compiles `syncra-desktop` (`desktop/src-tauri`), which links
      # against WebKitGTK/GTK headers at compile time — even for `cargo test`/`cargo clippy`,
      # not only `tauri build`. Shares the Linux prep script with `desktop-tauri-build`, so
      # there is no second list to keep identical any more.
      # One script, not two copies: the list drifted between these jobs once already
      # (libgbm-dev landed in one and not the other) and cost a red bundle job. The
      # rationale for every package, and for the ones deliberately left out, lives there.
      - name: Prepare Linux runner (disk report + reclaim, system deps)
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-runner-prep.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch ref pinned to a commit; action publishes no version tags)
        with:
          toolchain: stable
          components: clippy

      # --- Precondition 3 -------------------------------------------------------
      # Cold vendored-OpenSSL compile measured at 7m53s locally (F3-A, whole workspace,
      # after `.cargo/config.toml` removal). rust-cache keys on job id + OS + rustc version +
      # Cargo.lock hash automatically; without caching every run pays that cost again.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop -> target

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # cargo audit (SYNCDESKTOP.md F2 kabul: "cargo audit temiz")
  # ---------------------------------------------------------------------------
  desktop-cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        # F3-E: `desktop/` is the workspace root; `cargo audit` reads the single
        # `desktop/Cargo.lock` regardless of cwd (it walks up to the workspace root either
        # way), but running from here keeps this job's paths consistent with `desktop-rust`.
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop -> target
          cache-bin: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # frontend: tsc, i18n parity/bootstrap, web build (docs/ENGINEERING-RULES.md §0.4 Tuzak 1/2)
  # ---------------------------------------------------------------------------
  desktop-frontend:
    name: frontend (typecheck, i18n, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Trap 1 (docs/ENGINEERING-RULES.md §2): the root tsconfig.json is solution-style (references-only);
      # a bare `tsc --noEmit` matches nothing and silently exits 0. Always target the app
      # tsconfig explicitly.
      - name: Typecheck (tsconfig.app.json)
        run: npx tsc -p tsconfig.app.json --noEmit

      # Trap 2 (docs/ENGINEERING-RULES.md §2): check-i18n-bootstrap.mjs asserts against the literal source
      # text of src/i18n/index.ts and src/main.tsx. If a future change to this workflow's
      # frontend steps needs those files touched, the script needs updating too.
      - name: i18n parity check
        run: npm run i18n:check
      - name: i18n bootstrap check
        run: npm run i18n:check-bootstrap

      - name: Web bundle build (must stay unaffected by desktop work)
        run: npm run build

      # The third wire-fixture consumer. `wire-fixtures/` is read by three suites: the crate
      # (does `to_wire()` produce this?), PHPUnit (does the server accept this?), and these
      # vitest specs (does the TypeScript composer build this?). Only the third one catches the
      # class where the crate serialises correctly but the composer hands it an empty payload —
      # open item O47 was exactly that, and the crate<->PHP pair could not have seen it.
      # Runs from `desktop/` (its own package.json and lockfile), not `frontend/`.
      - name: Install desktop workspace deps
        working-directory: desktop
        run: npm ci
      - name: Desktop unit tests (wire-fixture composer + mappers)
        working-directory: desktop
        run: npm test
      - name: Error code symmetry (errors.ts <-> desktop.json)
        working-directory: desktop
        run: npm run check:errors

  # ---------------------------------------------------------------------------
  # backend: php artisan test — Linux job only is sufficient per task brief
  # ---------------------------------------------------------------------------
  desktop-backend:
    name: backend (php artisan test)
    runs-on: ubuntu-24.04
    # Measured F3-E: 1402 tests / ~280s locally. Generous margin over that for a colder CI
    # runner + composer install + service container startup, well under the 360min default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Precondition 5: a job-scoped database name, never `syncra_crm` / `syncra_crm_test`
      # (docs/ENGINEERING-RULES.md §8 forbids touching those without explicit per-call approval; a CI
      # service container is disposable per-run anyway, but the name is kept distinct
      # so a misconfigured local DB_DATABASE can never point a developer's real dev/test
      # database at this job by accident).
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: desktop_ci_backend_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Precondition 6: `backend/.env.example` points SESSION_DRIVER, QUEUE_CONNECTION and
      # CACHE_STORE at redis, and the CI `.env` is copied from it verbatim. Without a Redis
      # server 15 tests fail with "Connection refused [tcp://127.0.0.1:6379]": queue dispatch
      # (LeadImportTest, NotificationTriggerTest), rate limiting (ExportThrottleTest) and
      # SyncVersionMechanismTest. Pointing those drivers at `sync`/`array` instead would turn
      # the job green while silently exercising a different execution model than production,
      # so the server is provided rather than the drivers swapped.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: desktop_ci_backend_test
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, redis, bcmath, gd, zip
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure .env for CI
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: php artisan test
        run: php artisan test

  # ---------------------------------------------------------------------------
  # tauri build --debug, 3-OS matrix (SYNCDESKTOP.md F7). Depends on desktop-rust
  # (crate must compile/pass first) and desktop-frontend (web assets must build).
  # ---------------------------------------------------------------------------
  desktop-tauri-build:
    name: tauri build --debug (${{ matrix.os }})
    needs: [desktop-rust, desktop-frontend]
    runs-on: ${{ matrix.os }}
    # Cold vendored-OpenSSL compile alone measured 7m53s (F3-A); this job also runs the
    # frontend build and Tauri bundling on top of that, so it gets more headroom than
    # desktop-rust.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same Windows preconditions as desktop-rust (see the full diagnosis in the comments
      # there) — this job compiles the same `desktop/` workspace (syncra-sync +
      # syncra-desktop) and hits the same vendored-OpenSSL Perl/MAX_PATH issues.
      - name: Prefer Strawberry Perl over Git's Perl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strawberry = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path $strawberry)) {
            throw "Strawberry Perl not found at $strawberry - runner image changed, update this step"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $strawberry

      - name: Use short CARGO_TARGET_DIR (Windows MAX_PATH workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_TARGET_DIR=C:\t'

      # Precondition 4: Linux build/runtime dependencies and disk headroom.
      # One script, not two copies: the list drifted between these jobs once already
      # (libgbm-dev landed in one and not the other) and cost a red bundle job. The
      # rationale for every package, and for the ones deliberately left out, lives there.
      - name: Prepare Linux runner (disk report + reclaim, system deps)
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-runner-prep.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # F3-E: `desktop/.cargo/config.toml` (which used to redirect the target dir into
      # `crates/syncra-sync/target`) was removed in F3-A. The workspace's own default
      # `desktop/target` is what this job — and `desktop-rust` — actually build into now.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop -> target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      # F3-E: `desktop/vite.desktop.config.ts` aliases `@` to `../frontend/src`, and that
      # tree's own bare imports (axios, i18next, react-router-dom, ...) resolve via Node's
      # module resolution walking up from the importing file — i.e. from
      # `frontend/node_modules`, not `desktop/node_modules` (confirmed: `axios` exists only
      # under the former). The desktop shell has its own separate `node_modules`
      # (`docs/DESKTOP-ARCHITECTURE.md` KARAR A1 keeps `@tauri-apps/*` out of
      # `frontend/package.json`), so both installs are required for `build:desktop` to
      # resolve anything from the shared `frontend/src` tree.
      - name: Install desktop shell dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # F3-E (E.5.2 ACIK 1, now CLOSED): `desktop/scripts/tauri.mjs` builds the production
      # CSP from `../frontend/.env`, the same file `VITE_API_URL`/`VITE_REVERB_*` come from.
      # That file is real, developer-local, and gitignored — CI has none. Seeding it from the
      # example gives a syntactically real CSP (localhost hosts) so this job actually
      # exercises the CSP-generation path end-to-end; it is NOT a production host and must
      # not be treated as one (see the F7 precondition note in desktop-release.yml for the
      # real-host requirement on a signed release build).
      #
      # O27: `npm run check:release-host` — the gate that REJECTS these localhost values — is
      # deliberately not run in this workflow. Building CI against localhost is correct; only
      # `desktop-release.yml` (which publishes to end users) is entitled to demand a real host.
      - name: Seed frontend/.env for CSP generation (CI has no real one; gitignored)
        working-directory: frontend
        run: cp .env.example .env

      # F3-E: `custom-protocol` is deliberately NOT a default feature on `syncra-desktop`
      # (`desktop/src-tauri/Cargo.toml`) — with it default-off, `cargo check`/`clippy` don't
      # require `desktop/dist` to exist (E.5.3 Duzeltme 3). But `desktop/dist` DOES exist now
      # (F3-A's `vite.desktop.config.ts` + `build:desktop` produce it), and an actual
      # packaged build needs its frontend embedded rather than pointed at `devUrl` — so this
      # step, unlike desktop-rust's `cargo test`/`clippy`, opts back in explicitly. Confirmed
      # via `npm run tauri -- build --help`: `-f, --features [<FEATURES>...]` is a real CLI
      # flag, not an assumption.
      # `--config scripts/ci-unsigned-bundle.json` turns `bundle.createUpdaterArtifacts` back
      # OFF for this job, and only this job. The base config turns it ON (TM-F16 / open item
      # O108): without it `tauri build` emitted no `.sig` and no updater artifact at all, so
      # `desktop-release.yml`'s `includeUpdaterJson: true` had nothing to sign and the updater
      # block added for O12 pointed at a manifest that could never exist. Measured, not
      # assumed: the 2026-09-01 bundle held exactly one .msi and one -setup.exe, nothing else.
      #
      # But with it ON the bundler REFUSES to finish without a private key — "A public key has
      # been found, but no private key", exit 1, measured on this exact command. This job must
      # not have that key: it runs on every push and PR, and a release-signing secret has no
      # business being reachable from there. So the job keeps proving what it exists to prove —
      # that the app still bundles into an MSI and an NSIS installer on this OS — and leaves
      # signing to `desktop-release.yml`, which holds the secret. Overriding here rather than
      # passing `--no-bundle` keeps the bundler itself under test.
      - name: tauri build --debug
        run: npm run tauri -- build --debug --features custom-protocol --config scripts/ci-unsigned-bundle.json

  # ---------------------------------------------------------------------------
  # Release-profile smoke test (SYNCDESKTOP.md §6.5 / §10 F7).
  #
  # WHY THIS EXISTS — the blind spot it closes
  # `desktop-tauri-build` runs `tauri build --debug`, which keeps `debug_assertions` ON.
  # `desktop/src-tauri/src/lib.rs` USED TO gate the updater plugin behind
  # `#[cfg(not(debug_assertions))]`, so that block was never even compiled by the job above:
  # the entire release-only configuration of this app was invisible to CI. That `cfg` is gone
  # as of O12 — registration is unconditional now, so every build exercises the same
  # plugin-init path — but this job stays, because `debug_assertions` still changes real
  # behaviour (log level, `debug_assert!`, optimisation) and a release profile is the only
  # thing that proves the shipped binary starts. The first real
  # release build (F7, 2026-08-31) failed exactly there — `tauri-plugin-updater`'s `Config`
  # has a mandatory, default-less `pubkey`, so `.setup()` panicked and the binary exited 101
  # without ever opening a window. A shipped-artifact-does-not-start bug, and CI was green.
  #
  # WHY A SEPARATE JOB, not another step on `desktop-tauri-build (windows-latest)`
  #  1. Signal separation, and it matters *today*: this job is expected to be RED (see the
  #     step comment below). Folding it into the Windows matrix leg would paint that leg red
  #     for a reason unrelated to the debug build, and a genuine debug-build regression would
  #     hide behind the known failure. As its own check the expected-red is contained and
  #     named.
  #  2. No compile work is duplicated by splitting: debug and release are different cargo
  #     profiles and share no artifacts, so the release build pays a full compile wherever it
  #     is placed. Running it as its own job puts that cost in parallel with the 3-OS matrix
  #     instead of serialising it behind the slowest leg (Windows, which already carries the
  #     vendored-OpenSSL Perl/MAX_PATH preconditions and a 40-minute budget).
  #
  # WHY WINDOWS ONLY
  # Deliberate. The bug class this catches — a plugin whose `.setup()` refuses a missing
  # config — is platform-independent, so a second and third OS would buy a repeat of the same
  # signal at triple the runner cost. Windows is also the primary target platform.
  #
  # WHY NOT A FULL BUNDLE
  # `--no-bundle` on purpose: the failure is in `.setup()` at process start, not in installer
  # generation, and `desktop-release.yml` is what owns bundling. Skipping the bundler removes
  # several minutes and the signing/NSIS surface from this gate.
  # ---------------------------------------------------------------------------
  desktop-release-smoke:
    name: release smoke (windows)
    needs: [desktop-rust, desktop-frontend]
    runs-on: windows-latest
    # Same reasoning as desktop-tauri-build: a cold vendored-OpenSSL compile dominates, and
    # the release profile cannot reuse the debug profile's artifacts.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same two Windows preconditions as desktop-rust / desktop-tauri-build — full diagnosis
      # in the comments on desktop-rust. This job compiles the same workspace and hits the
      # same vendored-OpenSSL Perl lookup and MAX_PATH limits.
      - name: Prefer Strawberry Perl over Git's Perl (Windows)
        shell: pwsh
        run: |
          $strawberry = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path $strawberry)) {
            throw "Strawberry Perl not found at $strawberry - runner image changed, update this step"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $strawberry

      - name: Use short CARGO_TARGET_DIR (Windows MAX_PATH workaround)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_TARGET_DIR=C:\t'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # rust-cache keys on job id, so this job gets its own cache entry — which is what we
      # want: it holds release-profile artifacts, and mixing them into desktop-tauri-build's
      # debug cache would only inflate that one.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop -> target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      # Both installs are required: `desktop/vite.desktop.config.ts` aliases `@` to
      # `../frontend/src`, whose bare imports resolve out of `frontend/node_modules`, while
      # `@tauri-apps/*` lives only in `desktop/node_modules`. Same as desktop-tauri-build.
      - name: Install desktop shell dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # `desktop/scripts/tauri.mjs` derives the production CSP from `../frontend/.env`, which
      # is gitignored and does not exist on a runner. Seeded from the example so the CSP path
      # is exercised; these are localhost hosts and are NOT a production configuration.
      #
      # This seeding is also what keeps `src-tauri/build.rs`'s release guard (O4) satisfied:
      # the build below is the RELEASE profile, and that guard refuses any release build whose
      # `SYNCRA_API_URL` / CSP overlay did not come from the wrapper. Localhost is accepted
      # here on purpose — the loopback rejection lives in `desktop-release.yml`, not in CI.
      - name: Seed frontend/.env for CSP generation (CI has no real one; gitignored)
        working-directory: frontend
        run: cp .env.example .env

      # RELEASE profile — no `--debug`. This is the whole point of the job: it is the only
      # place in CI where `#[cfg(not(debug_assertions))]` code is compiled at all.
      - name: tauri build (release, no bundle)
        run: npm run tauri -- build --no-bundle --features custom-protocol

      # ⚠️ EXPECTED RED, AND THAT IS THE CORRECT STATE (open item O12).
      # `desktop/src-tauri/tauri.conf.json` has no `plugins.updater` block, because that block
      # requires the real minisign public key the maintainer has yet to generate. Until it
      # lands, the release binary panics in `.setup()` and this step fails with exit code 101.
      # That failure is the finding, not a flaw in the gate.
      #
      # Do NOT "fix" this by: committing a placeholder pubkey (rejected in lib.rs:75-77 — a
      # fake signing key in the repo is exactly the placeholder that survives to production),
      # deleting the `#[cfg(not(debug_assertions))]` guard, or adding `continue-on-error` here.
      # This step turns green the moment `plugins.updater` is configured, and it must stay a
      # hard gate so that it does.
      #
      # Mechanism: start the built exe, wait up to 10 seconds, assert it is still alive, then
      # kill it. A release binary that cannot survive its own `.setup()` dies within
      # milliseconds, so a 10s window separates "started" from "crashed on launch" with a wide
      # margin. On early exit the exit code and captured stderr are printed and the job fails.
      # windows-latest ships WebView2 preinstalled, so window creation is a real code path here
      # rather than an assumed one.
      #
      # `System.Diagnostics.Process` rather than `Start-Process -PassThru`: verified locally
      # (2026-09-01) that the object `Start-Process -PassThru` hands back reports
      # `HasExited = True` but a NULL `ExitCode`, even after `WaitForExit()` — which would
      # reduce the required "log the exit code" to an empty string exactly when it matters.
      # Starting the process directly reports the real code (measured: 101, the Rust panic
      # code, for today's updater failure). `ReadToEndAsync` is started before the wait so a
      # chatty binary cannot deadlock on a full pipe buffer.
      - name: Smoke test - release binary must stay alive for 10s
        shell: pwsh
        run: |
          # Two non-obvious requirements, both found by running this exact block locally
          # (2026-09-01) before it was committed:
          #  - `$ErrorActionPreference = 'Stop'` is mandatory, not hygiene. Without it a failed
          #    `Process::Start` leaves `$proc` null, every later `$proc.<member>` emits a
          #    non-terminating error, the `if ($proc.WaitForExit(...))` condition evaluates
          #    false, and the script falls through to the success branch and exits 0. A gate
          #    that reports green when it could not even launch the binary is worse than no
          #    gate. Reproduced exactly that way once; do not remove this line.
          #  - The path must be absolute. `Test-Path` resolves against PowerShell's provider
          #    location (the step's working-directory), but `ProcessStartInfo.FileName`
          #    resolves against the OS process working directory, which is not the same thing.
          #    A relative path passes the existence check and then fails to start.
          $ErrorActionPreference = 'Stop'

          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { 'target' }
          $exePath = Join-Path $targetDir 'release\syncra-desktop.exe'
          if (-not (Test-Path $exePath)) {
            throw "Release binary not found at $exePath - the build step's output layout changed"
          }
          $exe = (Resolve-Path $exePath).ProviderPath

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.WorkingDirectory = Split-Path -Parent $exe
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          if ($null -eq $proc) { throw "Process::Start returned null for $exe" }
          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()

          Write-Host "Started $exe (pid $($proc.Id)); waiting up to 10s..."

          if ($proc.WaitForExit(10000)) {
            $proc.WaitForExit()
            Write-Host "::error::Release binary died on launch with exit code $($proc.ExitCode). Known open item O12: tauri.conf.json has no plugins.updater block, so tauri-plugin-updater panics in .setup(). Do not silence this step - fix the config."
            Write-Host '--- stdout ---'
            Write-Host $stdoutTask.Result
            Write-Host '--- stderr ---'
            Write-Host $stderrTask.Result
            exit 1
          }

          Write-Host 'Still running after 10s - release binary starts cleanly.'
          $proc.Kill()
          exit 0
