name: Desktop Release

# DRAFT — SYNCDESKTOP.md F7 ("Paketleme ve CI").
#
# Never executed (push forbidden for lanes in this repo, docs/ENGINEERING-RULES.md §1 / SYNCDESKTOP.md
# §0.2). Syntax was only validated locally with a YAML parser — see the F(W2-c) phase
# report. Also depends on desktop/ (Tauri app, package.json, src-tauri/tauri.conf.json)
# which does not exist in this worktree yet (lands in F3); this is a forward-looking
# draft to be smoke-tested once F3 lands.
#
# Bundle targets (MSI+NSIS on Windows, DMG on macOS, AppImage+deb on Linux) are NOT
# chosen by this workflow — they come from `desktop/src-tauri/tauri.conf.json`'s
# `bundle.targets` (SYNCDESKTOP.md F7 kabul lists these four as the expected outputs;
# `tauri build` with no --bundles flag builds whatever that config declares for the
# host platform).

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing desktop-v* tag to (re-)publish a release for'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-desktop:
    name: build + publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Same Windows preconditions as desktop-ci.yml's desktop-rust job — see that
      # file for the full rationale (vendored OpenSSL needs Strawberry's Perl ahead
      # of Git's on PATH; MAX_PATH needs a short CARGO_TARGET_DIR).
      - name: Prefer Strawberry Perl over Git's Perl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strawberry = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path $strawberry)) {
            throw "Strawberry Perl not found at $strawberry - runner image changed, update this step"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $strawberry

      - name: Use short CARGO_TARGET_DIR (Windows MAX_PATH workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_TARGET_DIR=C:\t'

      # Precondition 4: Tauri v2 Linux build dependencies, per
      # https://v2.tauri.app/start/prerequisites/#linux (re-check against docs if this
      # starts failing on a missing library).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch ref pinned to a commit; action publishes no version tags)
        with:
          toolchain: stable

      # Precondition 3: cold vendored-OpenSSL compile ~7m45s locally (F2 measurement);
      # cache keys on job/OS/rustc/Cargo.lock automatically.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # tauri-action builds the app, creates/updates a (draft) GitHub Release tagged
      # with the pushed `desktop-v*` tag, uploads the platform bundle(s), and — because
      # TAURI_SIGNING_PRIVATE_KEY(+ _PASSWORD) is set — minisign-signs each bundle and
      # writes/merges the updater manifest (`latest.json`) into that same release.
      # Running this job across the 3-OS matrix against the same tag means each
      # platform's run appends its own signed entry to the one shared latest.json
      # (SYNCDESKTOP.md §6.5: updater manifest lives at
      # https://<release-host>/desktop/latest.json, channel `stable`).
      #
      # Secrets required (repo/environment secrets, not committed anywhere):
      #   TAURI_SIGNING_PRIVATE_KEY          - minisign private key (base64), generated
      #                                         via `tauri signer generate`
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - passphrase for the above
      #   GITHUB_TOKEN                       - provided automatically by Actions
      - name: tauri build + publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Syncra Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: 'See assets below to download and install this version. Auto-generated by desktop-release.yml.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
