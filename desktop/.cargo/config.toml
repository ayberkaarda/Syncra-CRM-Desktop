# Workspace-local Cargo config (`SYNCDESKTOP.md` §0.4 build trap note; phase report has the
# full story). `syncra-sync`'s `bundled-sqlcipher-vendored-openssl` feature vendors and
# compiles OpenSSL through Perl, which breaks under Git Bash's bundled Perl (missing
# `ExtUtils::MakeMaker`/`Locale::Maketext::Simple`) and, separately, under MAX_PATH-length
# limits from a deeply nested `target/` path.
#
# `crates/syncra-sync/target` already has that vendor build compiled and cached against 83
# passing tests. Pointing the *workspace's* target-dir there — instead of the default
# `desktop/target` — means `src-tauri` (a new workspace member that depends on `syncra-sync`
# by path) reuses that exact cached artifact instead of triggering a second, independent
# Perl/OpenSSL build. This is the structural fix for what was, before this file existed, a
# real failure: `src-tauri` compiled standalone with its own `target/` and hit the Perl trap
# on a cold run.
[build]
target-dir = "crates/syncra-sync/target"
