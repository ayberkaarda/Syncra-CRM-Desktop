[workspace]
resolver = "2"
members = ["crates/syncra-sync", "src-tauri"]

# Neither member declares its own `[workspace]` table, so both are free to join this one —
# verified before adding this file (`grep -n workspace crates/syncra-sync/Cargo.toml
# src-tauri/Cargo.toml` → no hits). A single shared `target/` is what makes
# `cargo check -p syncra-sync -p syncra-desktop` compile the SQLCipher/OpenSSL vendor tree
# in `syncra-sync` exactly once instead of twice (see `.cargo/config.toml` and the phase
# report for the Perl trap this avoids).

# Local disk. A full debug tree had grown to 45.6 GB (incremental 23.9, deps 15.7, build 3.4),
# nearly all of it debug info repeated across rebuilds. Dependencies are never stepped into, so
# they carry none; workspace crates keep line tables so backtraces still name file and line.
# CI's `CARGO_PROFILE_DEV_DEBUG=0` overrides the first setting (env beats this file).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The shipped binary. `panic` stays at the default `unwind` on purpose: `deep_link.rs` recovers
# from poisoned locks and `commands/files.rs` / `jump_list.rs` turn a worker panic into an error,
# all of which `abort` would replace with the whole app dying.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
